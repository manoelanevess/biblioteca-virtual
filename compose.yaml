services:
  postgres:
    image: postgres:17-alpine
    container_name: biblioteca_virtual_db
    environment:
      POSTGRES_DB: biblioteca_virtual
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d biblioteca_virtual']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

